# CineRoute compose example for the Debian NAS.
# App state lives under /srv/docker and media under /mnt/diskN/data/media.
services:
  cineroute:
    # Prebuilt image from GitHub Container Registry (see README):
    image: ghcr.io/YOUR_GITHUB_USERNAME/cineroute:latest
    # ...or build locally instead:
    # build: .
    container_name: cineroute
    user: "1000:1000"
    environment:
      TZ: America/Asuncion
      CINEROUTE_CONFIG: /config/config.yaml
      # 127.0.0.1 would be unreachable from outside the container:
      CINEROUTE_LISTEN: 0.0.0.0:8787
      # Requires config.yaml users with at least one admin and one user.
      CINEROUTE_PUBLIC_LISTEN: 0.0.0.0:8788
      CINEROUTE_TMDB_API_KEY: ${CINEROUTE_TMDB_API_KEY:-}
      CINEROUTE_QBIT_URL: ${CINEROUTE_QBIT_URL:-http://192.168.18.29:8080}
      CINEROUTE_QBIT_USERNAME: ${CINEROUTE_QBIT_USERNAME:-}
      CINEROUTE_QBIT_PASSWORD: ${CINEROUTE_QBIT_PASSWORD:-}
      CINEROUTE_PROWLARR_URL: ${CINEROUTE_PROWLARR_URL:-http://prowlarr:9696}
      CINEROUTE_PROWLARR_API_KEY: ${CINEROUTE_PROWLARR_API_KEY:-}
      # OpenSubtitles.com credentials for the Subtitles page:
      CINEROUTE_OS_API_KEY: ${CINEROUTE_OS_API_KEY:-}
      CINEROUTE_OS_USERNAME: ${CINEROUTE_OS_USERNAME:-}
      CINEROUTE_OS_PASSWORD: ${CINEROUTE_OS_PASSWORD:-}
      # Optional integrated music account (enable music in config.yaml):
      CINEROUTE_QOBUZ_USER_ID: ${CINEROUTE_QOBUZ_USER_ID:-}
      CINEROUTE_QOBUZ_TOKEN: ${CINEROUTE_QOBUZ_TOKEN:-}
      CINEROUTE_AUTH_PASSWORD: ${CINEROUTE_AUTH_PASSWORD:-}
    volumes:
      # Configuration on the NAS:
      - /srv/docker/cineroute/config.yaml:/config/config.yaml:ro
      # Request settings and subtitle state (writable by UID 1000 / GID 1000):
      - /srv/docker/cineroute/data:/data
      # Subtitle work files (reference, downloaded, aligned). Disposable; keep
      # it on a fast path so /tmp does not fill the container's writable layer.
      - /srv/docker/cineroute/tmp:/tmp
      # Optional music library and staging. Uncomment and set your NAS paths
      # before enabling music. Both must be writable by the container user.
      # - /mnt/music/library:/music
      # - /mnt/music/staging:/staging
      # Mount each disk once; qBittorrent must use the same /diskN paths.
      - /mnt/disk1/data:/disk1
      - /mnt/disk2/data:/disk2
      - /mnt/disk3/data:/disk3
      - /mnt/disk4/data:/disk4
    ports:
      # Bind administration to the NAS LAN IP, never all host interfaces.
      - "${CINEROUTE_ADMIN_BIND_IP:-192.168.18.29}:8787:8787"
      # For cloudflared running on the Docker host: localhost:8788.
      # With cloudflared on a shared Docker network use cineroute:8788 instead;
      # this host publication can then be removed.
      - "127.0.0.1:8788:8788"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
