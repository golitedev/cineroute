<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineRoute</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#0f1115;--panel:#171a21;--border:#2a2f3a;--text:#e6e9ef;--dim:#8b93a3;--accent:#4c8dff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);background:#13161c}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}
header #brand{height:26px;display:block}
header #brandIcon{height:26px;width:26px;border-radius:5px}
header .tag{color:var(--dim);font-size:12px}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
#drop{border:2px dashed var(--border);border-radius:10px;padding:48px 20px;text-align:center;cursor:pointer;transition:.15s}
#drop.drag{border-color:var(--accent);background:#121a2e}
#drop p{margin:0;color:var(--dim)}
button{background:#1f2430;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-weight:500;width:170px}
.kv td:first-child{color:var(--dim);width:190px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;border:1px solid var(--border)}
.badge.ok{color:var(--ok);border-color:#2c6a3a}
.badge.err{color:var(--err);border-color:#7a2f2d}
.badge.warn{color:var(--warn);border-color:#6b5214}
.tmdb-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.tmdb-item:hover{border-color:var(--accent)}
.tmdb-item.selected{border-color:var(--accent);background:#121a2e}
.tmdb-item img{width:46px;height:69px;object-fit:cover;border-radius:4px;background:#0f1115;flex:none}
.tmdb-item .t{font-weight:600}
.tmdb-item .d{color:var(--dim);font-size:12px;margin-top:2px}
.tmdb-item .y{color:var(--dim)}
.hidden{display:none}
.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.errbox{background:#2d1618;border:1px solid #7a2f2d;border-radius:8px;padding:10px 12px;color:#ff9b92;white-space:pre-wrap;margin-top:10px}
.okbox{background:#12261a;border:1px solid #2c6a3a;border-radius:8px;padding:10px 12px;color:#7ee787;margin-top:10px}
#statusbar{display:flex;flex-wrap:wrap;gap:6px}
input[type=text],input[type=number]{background:#0f1115;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px}
input[type=number]{width:90px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{color:var(--dim);font-size:12px}
#files{max-height:160px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1><img id="brandIcon" src="/favicon.svg" alt=""> <img id="brand" src="/logo.svg" alt="CineRoute"></h1>
  <span class="tag">route torrents into the media library</span>
  <div id="statusbar" style="margin-left:auto"></div>
</header>
<main>

<div class="card" id="uploadCard">
  <div id="drop">
    <p><strong>Drop .torrent files here</strong><br>one or many at once — or click to browse</p>
    <input type="file" id="file" accept=".torrent" multiple hidden>
  </div>
</div>

<div id="stack"></div>

<div class="card hidden" id="historyCard">
  <h2>Recent submissions</h2>
  <table><thead><tr><th>Time</th><th>Title</th><th>Save path</th><th>Status</th></tr></thead>
  <tbody id="historyBody"></tbody></table>
</div>

</main>
<script>
const $=id=>document.getElementById(id);
let intakes=[];
const busy=new Set();

const fmtBytes=n=>{
  if(n===0)return "0 B";
  const u=["B","KiB","MiB","GiB","TiB"];let i=0;let v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return v.toFixed(i?1:0)+" "+u[i];
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seasonLbl=m=>m.season?("S"+String(m.season).padStart(2,"0")):"—";

async function api(path,opts={}){
  const r=await fetch(path,opts);
  const j=await r.json().catch(()=>({}));
  if(!r.ok&&!j.intake)throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function postJSON(path,body){
  return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
}

// ---- status ----
async function loadStatus(){
  try{
    const s=await api("/api/status");
    const b=$("statusbar");
    b.innerHTML="";
    const add=(txt,cls)=>b.appendChild(Object.assign(document.createElement("span"),{className:"badge "+cls,textContent:txt}));
    add("qb: "+s.qbittorrent,s.qbittorrent==="ok"?"ok":"err");
    if(s.tmdb==="configured")add("tmdb: ok","ok");else add("tmdb: "+s.tmdb,"warn");
    if(s.preallocate&&s.preallocate.includes("enabled"))add("prealloc: on","warn");
    if(s.temp_path&&s.temp_path.includes("enabled"))add("temp path: on","warn");
    const st=s.storage||{};
    const el=document.createElement("span");
    el.className="badge "+(st.healthy?"ok":"err");
    el.innerHTML='<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v2h14V5H5zm0 6v6h14v-6H5zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>'+
      (st.healthy?fmtBytes(st.free)+" free":(st.err||"storage unavailable"));
    b.appendChild(el);
  }catch(e){$("statusbar").textContent="status: "+e.message;}
}

// ---- upload ----
const drop=$("drop"),file=$("file");
drop.addEventListener("click",()=>file.click());
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag")});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files.length)sendFiles(e.dataTransfer.files)});
file.addEventListener("change",()=>{if(file.files.length)sendFiles(file.files);file.value=""});

async function sendFiles(list){
  const fd=new FormData();
  for(const f of list)fd.append("torrents",f);
  try{await api("/api/intakes",{method:"POST",body:fd});await refresh()}catch(e){alert(e.message)}
}

// ---- actions ----
async function setType(id,t){
  try{await postJSON("/api/intakes/"+id+"/type",{media_type:t});await refresh()}catch(e){alert(e.message)}
}
async function search(id){
  const q=$("qt"+id).value.trim();if(!q)return;
  try{await postJSON("/api/intakes/"+id+"/search",{query:q,year:+$("qy"+id).value||0});await refresh()}catch(e){alert(e.message)}
}
async function pick(id,rid){
  try{await postJSON("/api/intakes/"+id+"/match",{tmdb_id:rid});await refresh()}catch(e){alert(e.message)}
}
async function submit(id){
  const g=intakes.find(x=>x.id===id);if(!g)return;
  busy.add(g.group);render();
  try{await postJSON("/api/intakes/"+id+"/submit")}catch(e){}
  busy.delete(g.group);
  await refresh();
}

// ---- render ----
function refresh(){
  api("/api/intakes").then(j=>{
    intakes=j.intakes||[];
    render();
  }).catch(()=>{intakes=[];render()});
}

function groups(){
  const m=new Map();
  for(const x of intakes){
    const k=x.group||x.id;
    if(!m.has(k))m.set(k,[]);
    m.get(k).push(x);
  }
  return [...m.values()].sort((a,b)=>(a[0].created_at||0)-(b[0].created_at||0));
}

function render(){
  $("stack").innerHTML=groups().map(g=>g.length===1?cardSingle(g[0]):cardTV(g)).join("");
}

const errBox=msg=>msg?'<div class="errbox">'+esc(msg)+"</div>":"";
const statusBadge=m=>{
  if(m.status==="submitted")return '<span class="badge ok">submitted</span>';
  if(m.status==="failed")return '<span class="badge err">failed</span>';
  if(m.status==="submitting")return '<span class="badge warn">submitting…</span>';
  return '<span class="badge">'+(m.match?"matched":"pending match")+"</span>";
};

function tmdbHTML(x){
  if(!x.tmdb||!x.tmdb.length)return "";
  const mid=x.match&&x.match.id;
  return '<div style="margin-top:14px"><h2>TMDB match <span class="small">— first result auto-confirmed, click another to change</span></h2>'+
    x.tmdb.map((r,i)=>{
      const title=r.title||r.name;const yr=(r.release_date||r.first_air_date||"").slice(0,4);
      const poster=r.poster_path?('<img src="https://image.tmdb.org/t/p/w92'+esc(r.poster_path)+'" alt="" loading="lazy">'):'<img alt="">';
      const sel=r.id===mid?" selected":"";
      return '<div class="tmdb-item'+sel+'" onclick="pick(\''+x.id+'\','+r.id+')">'+poster+'<div><div class="t">'+esc(title)+' <span class="y">('+esc(yr)+")</span></div>"+
        (r.overview?'<div class="d">'+esc(r.overview.slice(0,140))+"…</div>":"")+"</div></div>";
    }).join("")+'</div>';
}

function cardSingle(x){
  const btn=(t,l)=>'<button class="'+(x.media_type===t?"primary":"")+'" onclick="setType(\''+x.id+'\',\''+t+'\')">'+l+"</button>";
  return '<div class="card">'+
    '<h2>'+esc(x.torrent_name)+'</h2>'+
    '<table class="kv"><tbody>'+[
      ["File",esc(x.filename)],
      ["Size",fmtBytes(x.size)],
      ["Layout",x.kind==="single"?"Single file":x.kind==="rooted-multi"?"Multi-file (rooted)":"Multi-file (rootless)"],
      ["Root folder",x.root_folder?"true":"false"],
      ["Info hash",'<span class="mono">'+esc(x.info_hash_v1||x.info_hash_v2||"—")+"</span>"],
      ["Files",x.files],
      ["Detected type",'<span class="badge '+(x.media_type==="tv"?"ok":"")+'">'+esc(x.media_type)+"</span> <span class='small'>("+esc(x.confidence)+" confidence)</span>"],
      ["Search title",esc(x.title||"—")],
      ["Year",x.year||"—"],
      ["Season",x.season||"—"],
    ].map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("")+'</tbody></table>'+
    '<div class="row" style="margin-top:12px">'+
      '<span class="small">Type:</span>'+btn("movie","Movie")+btn("tv","TV show")+
      '<input type="text" id="qt'+x.id+'" placeholder="Search title" value="'+esc(x.title||"")+'">'+
      '<input type="number" id="qy'+x.id+'" placeholder="Year" value="'+(x.year||"")+'">'+
      '<button onclick="search(\''+x.id+'\')">Search TMDB</button>'+
    '</div>'+
    errBox(x.tmdb_error)+
    tmdbHTML(x)+
    (x.match?destHTML(x):"")+
  '</div>';
}

function destHTML(x){
  const dest=x.dest;
  let rows=[];
  if(dest){
    rows=[
      ["Media type",esc(x.media_type)],
      ["TMDB title",esc((x.match&&(x.match.title||x.match.name))||"")],
      ["Year",x.match?(x.match.release_date||x.match.first_air_date||"").slice(0,4):"—"],
      ["Canonical folder",'<span class="mono">'+esc(dest.folder_name)+"</span>"],
      ["Drive",esc(dest.drive_id||"—")],
      ["Existing library folder",dest.existing?"yes":"no"],
      ["Save path",'<span class="mono">'+esc(dest.save_path)+"</span>"],
      ["Content path",'<span class="mono">'+esc(dest.content_path)+"</span>"],
      ["root_folder",String(dest.root_folder)],
      ["Torrent size",fmtBytes(dest.needed_bytes)],
      ["Usable space on drive",dest.usable_space?fmtBytes(dest.usable_space):"—"],
    ];
  }
  let html='<div style="margin-top:14px"><h2>Destination</h2>'+
    '<table class="kv"><tbody>'+rows.map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("")+'</tbody></table>';
  if(dest&&dest.warnings&&dest.warnings.length){
    html+='<div class="errbox" style="background:#2b2412;border-color:#6b5214;color:#e3b341">'+esc(dest.warnings.join("\n"))+"</div>";
  }
  if(dest&&dest.existing_paths&&dest.existing_paths.length>1){
    html+='<div class="errbox">'+esc("Title exists at:\n"+dest.existing_paths.join("\n"))+"<br>Resolve the duplicates in your library first.</div>";
  }else if(x.error&&x.status!=="submitted"){
    html+='<div class="errbox">'+esc(x.error)+"</div>";
  }
  if(x.status==="submitted"&&x.result){
    html+='<div class="okbox"><strong>Torrent added and started</strong><br>'+
      '<table class="kv" style="margin-top:8px"><tbody>'+
      "<tr><td>qBittorrent name</td><td>"+esc(x.result.torrent_name)+"</td></tr>"+
      "<tr><td>Save path</td><td class='mono'>"+esc(x.result.save_path)+"</td></tr>"+
      "<tr><td>Content path</td><td class='mono'>"+esc(x.result.content_path)+"</td></tr>"+
      "<tr><td>Category</td><td>"+esc(x.result.category)+"</td></tr>"+
      "<tr><td>Drive</td><td>"+esc(x.result.drive_id)+"</td></tr>"+
      "<tr><td>Hash</td><td class='mono'>"+esc(x.result.hash)+"</td></tr>"+
      "</tbody></table>"+
      '<span class="small">CineRoute will perform no further operations on this torrent.</span></div>';
  }else if(x.status==="submitting"||busy.has(x.group)){
    html+='<div class="okbox">Adding stopped, verifying, starting…</div>';
  }else{
    html+='<div class="actions"><button class="primary" onclick="submit(\''+x.id+'\')">Add to qBittorrent (stopped, verify, start)</button></div>';
  }
  return html+'</div>';
}

function cardTV(g){
  const rep=g[0];
  const title=rep.title||rep.torrent_name;
  const yr=rep.year?" ("+rep.year+")":"";
  const busyKey=rep.group;
  const allSubmitted=g.every(x=>x.status==="submitted");
  const rows=g.map(m=>'<tr><td>'+seasonLbl(m)+'</td><td class="mono">'+esc(m.torrent_name)+'</td><td>'+fmtBytes(m.size)+'</td><td>'+statusBadge(m)+'</td></tr>').join("");
  let html='<div class="card">'+
    '<h2>TV show · '+esc(title)+yr+' <span class="small">('+g.length+' parts)</span></h2>'+
    '<table><thead><tr><th>Season</th><th>Torrent</th><th>Size</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="row" style="margin-top:12px">'+
      '<input type="text" id="qt'+rep.id+'" placeholder="Search title" value="'+esc(rep.title||"")+'">'+
      '<input type="number" id="qy'+rep.id+'" placeholder="Year" value="'+(rep.year||"")+'">'+
      '<button onclick="search(\''+rep.id+'\')">Search TMDB</button>'+
    '</div>'+
    errBox(rep.tmdb_error)+
    tmdbHTML(rep);
  if(rep.match){
    const dest=rep.dest;
    html+='<div style="margin-top:14px"><h2>Destination</h2>'+
      '<table class="kv"><tbody>'+
      "<tr><td>TMDB title</td><td>"+esc(rep.match.title||rep.match.name)+"</td></tr>"+
      "<tr><td>Canonical folder</td><td class='mono'>"+esc(dest.folder_name)+"</td></tr>"+
      "<tr><td>Drive</td><td>"+esc(dest.drive_id||"—")+"</td></tr>"+
      (dest.existing?"<tr><td>Existing library folder</td><td>yes</td></tr>":"")+
      "<tr><td>Save path</td><td class='mono'>"+esc(dest.save_path)+"</td></tr>"+
      '</tbody></table>';
    const msgs=g.map(m=>{
      if(m.status==="submitted"&&m.result)return "• "+seasonLbl(m)+": added and started — <span class='mono'>"+esc(m.result.hash)+"</span>";
      if(m.status==="failed")return "• "+seasonLbl(m)+": <b>failed</b> — "+esc(m.error);
      if(m.status==="submitting"||busy.has(busyKey))return "• "+seasonLbl(m)+": adding stopped, verifying, starting…";
      if(m.error)return "• "+seasonLbl(m)+": "+esc(m.error);
      return "";
    }).filter(Boolean).join("<br>");
    if(msgs)html+='<div class="'+(g.some(x=>x.status==="failed")?"errbox":"okbox")+'" style="margin-top:8px">'+msgs+"</div>";
    if(!allSubmitted&&!busy.has(busyKey)){
      html+='<div class="actions"><button class="primary" onclick="submit(\''+rep.id+'\')">Add all '+g.length+' to qBittorrent (stopped, verify, start)</button></div>';
    }
    html+='</div>';
  }
  return html+'</div>';
}

// ---- history ----
async function loadHistory(){
  try{
    const j=await api("/api/history");
    if(!j.history||!j.history.length){$("historyCard").classList.add("hidden");return}
    $("historyCard").classList.remove("hidden");
    $("historyBody").innerHTML=j.history.slice().reverse().map(h=>{
      const t=h.result?h.result.save_path:h.dest?h.dest.save_path:"";
      const title=h.match?(h.match.title||h.match.name):h.title;
      const cls=h.status==="submitted"?"ok":h.status==="failed"?"err":"warn";
      return "<tr><td>"+esc((h.result&&h.result.submitted_at||h.created_at||"").slice(11,19))+"</td><td>"+esc(title||"")+"</td><td class='mono'>"+esc(t)+"</td><td><span class='badge "+cls+"'>"+esc(h.status)+"</span></td></tr>";
    }).join("");
  }catch(e){}
}

loadStatus();loadHistory();refresh();
setInterval(loadStatus,30000);
</script>
</body>
</html>
