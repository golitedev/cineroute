<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineRoute</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#0f1115;--panel:#171a21;--border:#2a2f3a;--text:#e6e9ef;--dim:#8b93a3;--accent:#4c8dff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);background:#13161c}
header h1{font-size:18px;margin:0}
header #brand{height:26px;display:block}
header .tag{color:var(--dim);font-size:12px}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
#drop{border:2px dashed var(--border);border-radius:10px;padding:48px 20px;text-align:center;cursor:pointer;transition:.15s}
#drop.drag{border-color:var(--accent);background:#121a2e}
#drop p{margin:0;color:var(--dim)}
button{background:#1f2430;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-weight:500;width:170px}
.kv td:first-child{color:var(--dim);width:190px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;border:1px solid var(--border)}
.badge.ok{color:var(--ok);border-color:#2c6a3a}
.badge.err{color:var(--err);border-color:#7a2f2d}
.badge.warn{color:var(--warn);border-color:#6b5214}
.tmdb-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.tmdb-item:hover{border-color:var(--accent)}
.tmdb-item.selected{border-color:var(--accent);background:#121a2e}
.tmdb-item img{width:46px;height:69px;object-fit:cover;border-radius:4px;background:#0f1115;flex:none}
.tmdb-item .t{font-weight:600}
.tmdb-item .d{color:var(--dim);font-size:12px;margin-top:2px}
.tmdb-item .y{color:var(--dim)}
.hidden{display:none}
.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.errbox{background:#2d1618;border:1px solid #7a2f2d;border-radius:8px;padding:10px 12px;color:#ff9b92;white-space:pre-wrap;margin-top:10px}
.okbox{background:#12261a;border:1px solid #2c6a3a;border-radius:8px;padding:10px 12px;color:#7ee787;margin-top:10px}
#statusbar{display:flex;flex-wrap:wrap;gap:6px}
input[type=text],input[type=number]{background:#0f1115;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px}
input[type=number]{width:90px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.small{color:var(--dim);font-size:12px}
#files{max-height:160px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1><img id="brand" src="/logo.svg" alt="CineRoute"></h1>
  <span class="tag">route torrents into the media library</span>
  <div id="statusbar" style="margin-left:auto"></div>
</header>
<main>

<div class="card" id="uploadCard">
  <div id="drop">
    <p><strong>Drop a .torrent file here</strong><br>or click to browse</p>
    <input type="file" id="file" accept=".torrent" hidden>
  </div>
</div>

<div class="card hidden" id="analysisCard">
  <h2>Torrent analysis</h2>
  <table class="kv"><tbody id="analysisBody"></tbody></table>
  <div class="row" style="margin-top:12px">
    <span class="small">Type:</span>
    <button id="btnMovie">Movie</button>
    <button id="btnTV">TV show</button>
    <input type="text" id="qTitle" placeholder="Search title">
    <input type="number" id="qYear" placeholder="Year">
    <button id="btnSearch">Search TMDB</button>
  </div>
  <div id="tmdbError"></div>
</div>

<div class="card hidden" id="tmdbCard">
  <h2>TMDB match <span class="small">— click a result to confirm</span></h2>
  <div id="tmdbList"></div>
</div>

<div class="card hidden" id="destCard">
  <h2>Destination</h2>
  <table class="kv"><tbody id="destBody"></tbody></table>
  <div class="actions">
    <button class="primary" id="btnSubmit">Add to qBittorrent (stopped, verify, start)</button>
    <button id="btnCancel">Cancel</button>
  </div>
  <div id="submitResult"></div>
</div>

<div class="card hidden" id="historyCard">
  <h2>Recent submissions</h2>
  <table><thead><tr><th>Time</th><th>Title</th><th>Save path</th><th>Status</th></tr></thead>
  <tbody id="historyBody"></tbody></table>
</div>

</main>
<script>
const $=id=>document.getElementById(id);
let intake=null;

const fmtBytes=n=>{
  if(n===0)return "0 B";
  const u=["B","KiB","MiB","GiB","TiB"];let i=0;let v=n;
  while(v>=1024&&i<u.length-1){v/=1024;i++}
  return v.toFixed(i?1:0)+" "+u[i];
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path,opts={}){
  const r=await fetch(path,opts);
  const j=await r.json().catch(()=>({}));
  if(!r.ok&&!j.intake)throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function postJSON(path,body){
  return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
}

// ---- status ----
async function loadStatus(){
  try{
    const s=await api("/api/status");
    const b=$("statusbar");
    b.innerHTML="";
    const add=(txt,cls)=>b.appendChild(Object.assign(document.createElement("span"),{className:"badge "+cls,textContent:txt}));
    add("qb: "+s.qbittorrent,s.qbittorrent==="ok"?"ok":"err");
    if(s.tmdb==="configured")add("tmdb: ok","ok");else add("tmdb: "+s.tmdb,"warn");
    if(s.preallocate&&s.preallocate.includes("enabled"))add("prealloc: on","warn");
    if(s.temp_path&&s.temp_path.includes("enabled"))add("temp path: on","warn");
    add("movies: "+fmtBytes(s.movies.usable)+" free",s.movies.healthy?"ok":"err");
    add("tv: "+fmtBytes(s.tv.usable)+" free",s.tv.healthy?"ok":"err");
  }catch(e){$("statusbar").textContent="status: "+e.message;}
}

// ---- upload ----
const drop=$("drop"),file=$("file");
drop.addEventListener("click",()=>file.click());
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag")});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files[0])sendFile(e.dataTransfer.files[0])});
file.addEventListener("change",()=>{if(file.files[0])sendFile(file.files[0])});

async function sendFile(f){
  const fd=new FormData();fd.append("torrents",f);
  try{
    const j=await api("/api/intakes",{method:"POST",body:fd});
    intake=j.intake;render();loadHistory();
  }catch(e){alert(e.message)}
}

// ---- analysis ----
$("btnMovie").onclick=()=>setType("movie");
$("btnTV").onclick=()=>setType("tv");
async function setType(t){
  try{const j=await postJSON("/api/intakes/"+intake.id+"/type",{media_type:t});intake=j.intake;render()}catch(e){alert(e.message)}
}
$("btnSearch").onclick=async()=>{
  const q=$("qTitle").value.trim();if(!q)return;
  try{const j=await postJSON("/api/intakes/"+intake.id+"/search",{query:q,year:+$("qYear").value||0});intake=j.intake;render()}catch(e){alert(e.message)}
};
$("btnSubmit").onclick=async()=>{
  const btn=$("btnSubmit");btn.disabled=true;btn.textContent="Submitting…";
  $("submitResult").innerHTML="";
  try{
    const j=await postJSON("/api/intakes/"+intake.id+"/submit");
    intake=j.intake;render();loadHistory();
  }catch(e){
    $("submitResult").innerHTML='<div class="errbox">'+esc(e.message)+"</div>";
  }
  btn.disabled=false;btn.textContent="Add to qBittorrent (stopped, verify, start)";
};
$("btnCancel").onclick=()=>{intake=null;location.reload()};

// ---- render ----
function render(){
  if(!intake)return;
  $("uploadCard").classList.add("hidden");
  const a=$("analysisCard");a.classList.remove("hidden");
  $("analysisBody").innerHTML=[
    ["Torrent",esc(intake.torrent_name)],
    ["File",esc(intake.filename)],
    ["Size",fmtBytes(intake.size)],
    ["Layout",intake.kind==="single"?"Single file":intake.kind==="rooted-multi"?"Multi-file (rooted)":"Multi-file (rootless)"],
    ["Root folder",intake.root_folder?"true":"false"],
    ["Info hash",'<span class="mono">'+esc(intake.info_hash_v1||intake.info_hash_v2||"—")+"</span>"],
    ["Files",intake.files],
    ["Detected type",'<span class="badge '+(intake.media_type==="tv"?"ok":"")+'">'+esc(intake.media_type)+"</span> <span class='small'>("+esc(intake.confidence)+" confidence)</span>"],
    ["Search title",esc(intake.title||"—")],
    ["Year",intake.year||"—"],
    ["Season",intake.season||"—"],
  ].map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("");

  $("btnMovie").classList.toggle("primary",intake.media_type==="movie");
  $("btnTV").classList.toggle("primary",intake.media_type==="tv");

  $("qTitle").value=intake.title||"";
  $("qYear").value=intake.year||"";
  $("tmdbError").innerHTML="";
  if(intake.tmdb_error)$("tmdbError").innerHTML='<div class="errbox">'+esc(intake.tmdb_error)+"</div>";

  // TMDB results
  const tc=$("tmdbCard"),tl=$("tmdbList");
  if(intake.match){
    tc.classList.add("hidden");
    renderDest();
  }else if(intake.tmdb&&intake.tmdb.length){
    tc.classList.remove("hidden");
    tl.innerHTML=intake.tmdb.map(r=>{
      const title=r.title||r.name;const yr=(r.release_date||r.first_air_date||"").slice(0,4);
      const poster=r.poster_path?('<img src="https://image.tmdb.org/t/p/w92'+esc(r.poster_path)+'" alt="" loading="lazy">'):'<img alt="">';
      return '<div class="tmdb-item" onclick="pick('+r.id+')">'+poster+'<div><div class="t">'+esc(title)+' <span class="y">('+esc(yr)+")</span></div>"+
        (r.overview?'<div class="d">'+esc(r.overview.slice(0,140))+"…</div>":"")+"</div></div>";
    }).join("");
  }else if(intake.status!=="submitting"){
    tc.classList.add("hidden");
    renderDest();
  }
}

async function pick(id){
  try{
    const j=await postJSON("/api/intakes/"+intake.id+"/match",{tmdb_id:id});
    intake=j.intake;render();
  }catch(e){alert(e.message)}
}

function renderDest(){
  const d=$("destCard");d.classList.remove("hidden");
  const dest=intake.dest,err=intake.error;
  $("submitResult").innerHTML="";
  let rows=[];
  if(dest){
    rows=[
      ["Media type",esc(intake.media_type)],
      ["TMDB title",esc((intake.match&&(intake.match.title||intake.match.name))||"")],
      ["Year",intake.match?(intake.match.release_date||intake.match.first_air_date||"").slice(0,4):"—"],
      ["Canonical folder",'<span class="mono">'+esc(dest.folder_name)+"</span>"],
      ["Drive",esc(dest.drive_id||"—")],
      ["Existing library folder",dest.existing?"yes":"no"],
      ["Save path",'<span class="mono">'+esc(dest.save_path)+"</span>"],
      ["Content path",'<span class="mono">'+esc(dest.content_path)+"</span>"],
      ["root_folder",String(dest.root_folder)],
      ["Torrent size",fmtBytes(dest.needed_bytes)],
      ["Usable space on drive",dest.usable_space?fmtBytes(dest.usable_space):"—"],
    ];
  }
  $("destBody").innerHTML=rows.map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("");
  if(dest&&dest.warnings&&dest.warnings.length){
    $("submitResult").innerHTML='<div class="errbox" style="background:#2b2412;border-color:#6b5214;color:#e3b341">'+esc(dest.warnings.join("\n"))+"</div>";
  }
  if(dest&&dest.existing_paths&&dest.existing_paths.length>1){
    $("submitResult").innerHTML='<div class="errbox">'+esc("Title exists at:\n"+dest.existing_paths.join("\n"))+"<br>Resolve the duplicates in your library first.</div>";
  }else if(err&&intake.status!=="submitted"){
    $("submitResult").innerHTML='<div class="errbox">'+esc(err)+"</div>";
  }
  if(intake.status==="submitted"&&intake.result){
    $("btnSubmit").style.display="none";
    const r=intake.result;
    $("submitResult").innerHTML='<div class="okbox"><strong>Torrent added and started</strong><br>'+
      '<table class="kv" style="margin-top:8px"><tbody>'+
      "<tr><td>qBittorrent name</td><td>"+esc(r.torrent_name)+"</td></tr>"+
      "<tr><td>Save path</td><td class='mono'>"+esc(r.save_path)+"</td></tr>"+
      "<tr><td>Content path</td><td class='mono'>"+esc(r.content_path)+"</td></tr>"+
      "<tr><td>Category</td><td>"+esc(r.category)+"</td></tr>"+
      "<tr><td>Drive</td><td>"+esc(r.drive_id)+"</td></tr>"+
      "<tr><td>Hash</td><td class='mono'>"+esc(r.hash)+"</td></tr>"+
      "</tbody></table>"+
      '<span class="small">CineRoute will perform no further operations on this torrent.</span></div>';
  }else if(intake.status==="submitting"){
    $("submitResult").innerHTML='<div class="okbox">Adding stopped, verifying, starting…</div>';
  }
}

// ---- history ----
async function loadHistory(){
  try{
    const j=await api("/api/history");
    if(!j.history||!j.history.length){$("historyCard").classList.add("hidden");return}
    $("historyCard").classList.remove("hidden");
    $("historyBody").innerHTML=j.history.slice().reverse().map(h=>{
      const t=h.result?h.result.save_path:h.dest?h.dest.save_path:"";
      const title=h.match?(h.match.title||h.match.name):h.title;
      const cls=h.status==="submitted"?"ok":h.status==="failed"?"err":"warn";
      return "<tr><td>"+esc((h.result&&h.result.submitted_at||h.created_at||"").slice(11,19))+"</td><td>"+esc(title||"")+"</td><td class='mono'>"+esc(t)+"</td><td><span class='badge "+cls+"'>"+esc(h.status)+"</span></td></tr>";
    }).join("");
  }catch(e){}
}

loadStatus();loadHistory();
setInterval(loadStatus,30000);
</script>
</body>
</html>
