<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CineRoute</title>
<!-- Only the PNG is declared: when both PNG and SVG icon links are present,
     Firefox always picks the SVG, and SVG favicons do not render in the
     Firefox bookmarks toolbar. The SVG is still served for the header logo. -->
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
<script src="/viewport.js" defer></script>
</head>
<body>
<header>
  <h1><img id="brandIcon" src="/favicon.svg" alt=""> <img id="brand" src="/logo.svg" alt="CineRoute"></h1>
  <span class="tag" id="headerTag">movies and shows, requested by you</span>
  <div id="accountBar" class="row hidden" style="margin-left:auto"><span id="accountName" class="small"></span><button type="button" onclick="signOut()">Sign out</button></div>

</header>
<main>
<div class="card hidden" id="loginCard">
  <h2 class="login-title">Sign in to CineRoute</h2>
  <p class="login-sub">Enter your credentials to continue.</p>
  <label class="login-label" for="loginUser">Username</label>
  <div class="login-field">
    <input type="text" class="login-input" id="loginUser" placeholder="Enter username" autocomplete="username" name="username">
  </div>
  <label class="login-label" for="loginPass">Password</label>
  <div class="login-field">
    <input type="password" class="login-input login-pass" id="loginPass" placeholder="Enter password" autocomplete="current-password" name="password">
    <button type="button" class="login-toggle" id="loginToggle" onclick="togglePass()" title="Show password" aria-label="Show password">
      <span class="eye-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
      <span class="eye-closed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
    </button>
  </div>
  <button class="primary login-btn" id="loginBtn" onclick="login()">Sign in</button>
  <div id="loginErr" class="errbox hidden"></div>
</div>

<div id="userShell" class="hidden">
  <section id="catalogHero" class="catalog-hero">
    <h2>Your next watch</h2><p>Search for a movie or show. We’ll take care of the rest.</p>
    <form class="catalog-search" onsubmit="searchCatalog();return false">
      <label class="sr-only" for="catalogQuery">Search movies and TV shows</label>
      <input id="catalogQuery" type="search" minlength="2" maxlength="200" placeholder="Search movies and shows…" autocomplete="off" required>
      <button id="catalogSearchButton" type="submit" class="primary">Search</button>
    </form>
    <div id="catalogFilters" class="catalog-filters"><button type="button" class="active" data-type="all" onclick="setCatalogFilter('all')">All</button><button type="button" data-type="movie" onclick="setCatalogFilter('movie')">Movies</button><button type="button" data-type="tv" onclick="setCatalogFilter('tv')">TV shows</button></div>
    <div id="catalogMessage" class="small" role="status" aria-live="polite"></div>
  </section>
  <div id="catalogResults" class="catalog-results"></div><button id="catalogMore" type="button" class="hidden" style="margin:18px auto;display:block" onclick="searchCatalog(true)">Load more</button>
  <section id="catalogDetail" class="card hidden"></section>
  <section class="card" style="margin-top:24px"><div class="copy-toolbar"><h2>My requests</h2><button type="button" onclick="loadMyRequests()">Refresh</button></div><div id="myRequestMessage" class="small" role="status"></div><div id="myRequestList"></div></section>
  <p class="catalog-attribution">Movie and TV metadata provided by TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</div>

</main>
<script src="/catalog.js"></script>
<script src="/portal.js"></script>
</body>
</html>
