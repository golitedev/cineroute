name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test music download and import contracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flac
          go test ./internal/music/...

      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve Streamrip dev commit
        id: streamrip
        run: |
          set -euo pipefail
          revision="$(git ls-remote --exit-code https://github.com/golitedev/streamrip.git refs/heads/dev)"
          commit="${revision%%$'\t'*}"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # Export the candidate by digest. Release tags become visible only after
      # the packaged Streamrip version has been verified on every target.
      - uses: docker/build-push-action@v7
        id: candidate
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: STREAMRIP_REF=${{ steps.streamrip.outputs.commit }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cineroute
          cache-to: type=gha,mode=max,scope=cineroute

      - name: Verify Streamrip and publish image tags
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          STREAMRIP_COMMIT: ${{ steps.streamrip.outputs.commit }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate="$IMAGE@$DIGEST"
          IFS=, read -r -a platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            bash tools/verify-streamrip-image.sh "$candidate" "$platform" "$STREAMRIP_COMMIT"
          done
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          (( ${#tags[@]} > 0 ))
          docker buildx imagetools create "${tags[@]}" "$candidate"
