[package]
name = "lrcscript-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
flate2 = "1"
getrandom = "0.2"
log = "0.4"
percent-encoding = "2"
regex = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
lofty = "0.24.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }

[profile.release]
lto = true
strip = true
