# CineRoute configuration
# Copy to config.yaml and adjust. Secrets can be supplied via environment
# variables instead of this file.

# Note: inside a container this must be 0.0.0.0:8787 (or set CINEROUTE_LISTEN)
# or the web UI is unreachable from the host.
listen: "127.0.0.1:8787"

# Optional username/password for the web interface. Quote them if they
# contain special characters (# : " etc).
# Alternatively: CINEROUTE_AUTH_USERNAME, CINEROUTE_AUTH_PASSWORD
auth_username: "cineroute"
auth_password: ""

# Maximum .torrent upload size in bytes.
max_upload_bytes: 67108864

tmdb:
  # Either the classic v3 API key (32 hex chars) or the v4 API Read Access
  # Token (a long JWT) works — both are detected automatically.
  # Alternatively: CINEROUTE_TMDB_API_KEY
  api_key: ""
  language: "en-US"

qbittorrent:
  # Alternatively: CINEROUTE_QBIT_URL, CINEROUTE_QBIT_USERNAME, CINEROUTE_QBIT_PASSWORD
  url: "http://localhost:8080"
  username: "admin"
  password: ""

prowlarr:
  # LAT-Team must already be configured inside Prowlarr.
  # Alternatively: CINEROUTE_PROWLARR_URL, CINEROUTE_PROWLARR_API_KEY,
  # CINEROUTE_PROWLARR_INDEXER
  url: "http://localhost:9696"
  api_key: ""
  indexer_name: "LAT-Team"

companion:
  enabled: true
  state_path: "/data/companions.db"
  # These are soft ranking preferences; no Prowlarr release is filtered out.
  max_size_gib: 20
  min_seeders: 1
  search_limit: 50
  search_interval_seconds: 10

library:
  folder_format: "{title} ({year})"

# The four drives. The primary roots must be the same paths CineRoute and
# qBittorrent see (container-side aliases). Remote roots are optional for
# backwards compatibility; standard /mN -> /mrN aliases are also detected when
# mounted. Approved movie companions go to the matching remote folder.
drives:
  - id: "hdd1"
    movie_root: "/m1"
    movie_remote_root: "/mr1"
    tv_root: "/t1"
    tv_remote_root: "/tr1"

  - id: "hdd2"
    movie_root: "/m2"
    movie_remote_root: "/mr2"
    tv_root: "/t2"
    tv_remote_root: "/tr2"

  - id: "hdd3"
    movie_root: "/m3"
    movie_remote_root: "/mr3"
    tv_root: "/t3"
    tv_remote_root: "/tr3"

  - id: "hdd4"
    movie_root: "/m4"
    movie_remote_root: "/mr4"
    tv_root: "/t4"
    tv_remote_root: "/tr4"
