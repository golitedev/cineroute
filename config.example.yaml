# CineRoute configuration
# Copy to config.yaml and adjust. Secrets can be supplied via environment
# variables instead of this file.

# Note: inside a container this must be 0.0.0.0:8787 (or set CINEROUTE_LISTEN)
# or the web UI is unreachable from the host.
listen: "127.0.0.1:8787"

# Internet request portal, on its own listener. Empty disables it.
# Use 0.0.0.0:8788 inside Docker; tunnel ONLY this port.
# Requires an enabled role:user account as well as an admin account below.
# Alternatively: CINEROUTE_PUBLIC_LISTEN.
public_listen: ""

admin:
  # Checked against the actual TCP peer; proxy headers are rejected outright.
  # Narrow this list to your LAN and loopback. Direct Docker peers may require
  # adding that private bridge CIDR when accessing the published port locally.
  allowed_networks: ["127.0.0.0/8", "::1/128", "192.168.18.0/24"]
  # Empty: only localhost and literal private/loopback IP hosts are accepted.
  # Set exact names/IPs here if you use a LAN hostname; no wildcard/port.
  # Example: ["192.168.18.29", "nas.lan", "localhost", "127.0.0.1"]
  allowed_hosts: []

# Accounts are created here; restart CineRoute after editing. Admins manage
# the whole app; users see only movie/TV search and their own requests.
# Uncomment and replace these examples. At least one enabled admin is required.
# Each account uses either password or password_hash, never both.
# Generate a bcrypt hash with: ./cineroute hash-password < /path/to/password-file
# users:
#   - name: "admin"
#     role: "admin"
#     password: "replace-with-your-admin-password"
#   - name: "alice"
#     role: "user"
#     password_hash: "$2a$...replace-with-generated-bcrypt-hash..."
#     disabled: false

# Legacy single-admin login, used only when users is empty.
# Alternatively: CINEROUTE_AUTH_USERNAME, CINEROUTE_AUTH_PASSWORD.
# An empty users list AND empty auth_password prevents the server from starting.
auth_username: "cineroute"
auth_password: ""

# Maximum .torrent upload size in bytes.
max_upload_bytes: 67108864

tmdb:
  # Either the classic v3 API key (32 hex chars) or the v4 API Read Access
  # Token (a long JWT) works — both are detected automatically.
  # Alternatively: CINEROUTE_TMDB_API_KEY
  api_key: ""
  language: "en-US"

qbittorrent:
  # Alternatively: CINEROUTE_QBIT_URL, CINEROUTE_QBIT_USERNAME, CINEROUTE_QBIT_PASSWORD
  url: "http://192.168.18.29:8080"
  username: "admin"
  password: ""

prowlarr:
  # Used by Requests settings and automatic request searches/downloads.
  # Alternatively: CINEROUTE_PROWLARR_URL and CINEROUTE_PROWLARR_API_KEY.
  url: "http://localhost:9696"
  api_key: ""

requests:
  # Settings, requests, disk assignments and download recovery state.
  # Mount /data writable and persistent; session.key is saved alongside this DB.
  # Alternatively: CINEROUTE_REQUESTS_STATE_PATH.
  state_path: "/data/requests.db"

# Optional Jellyfin notifications after verified request downloads and subtitle
# installs. Restart CineRoute after changing these settings.
jellyfin:
  enabled: false  # Alternatively: CINEROUTE_JELLYFIN_ENABLED=true
  url: "http://jellyfin:8096"  # CINEROUTE_JELLYFIN_URL; include a base path if used
  api_key: ""  # CINEROUTE_JELLYFIN_API_KEY; create in Jellyfin Dashboard > API Keys
  state_path: "/data/jellyfin.db"  # CINEROUTE_JELLYFIN_STATE_PATH; persist /data
  # Empty means CineRoute and Jellyfin see identical absolute library paths.
  # Add mappings for Main/Remote movie and TV roots when mounts differ.
  # Most specific matching local root wins; matching respects folder boundaries.
  path_mappings: []
  # path_mappings:
  #   - local: "/disk1/media/movies-remote"
  #     remote: "/media/remote-movies"
  #   - local: "/disk1/media/movies"
  #     remote: "/media/movies"

# External subtitles for the remote movie libraries.
# CineRoute searches OpenSubtitles.com for every target language a movie is
# missing (a language with no candidate is reported and does not stop the
# others), picks a reference subtitle (external en/es first, then an embedded
# text stream) and syncs each subtitle with the bundled alass, writing
# <video-basename>.<language>.srt next to the remote movie.
subtitles:
  enabled: true
  # Queue database; mount /data writable.
  state_path: "/data/subtitles.db"
  # All intermediate files (reference, downloaded and aligned SRTs). Point this
  # at a scratch/SSD mount; the container's /tmp works well.
  work_dir: "/tmp/cineroute-subtitles"
  work_retention_days: 7
  # Languages to add, in order. A movie counts as done only when it has all of
  # them. Spanish is requested as es/ea/sp and the Latin American ("ea")
  # candidate is preferred over the Castilian ("sp") one.
  target_languages: ["sv", "es", "en"]
  # Legacy single-language form; still honoured when target_languages is absent.
  # target_language: "sv"
  # Languages preferred as the timing reference for alass.
  reference_languages: ["en", "es"]
  # Bundled in the image; override to use binaries installed elsewhere.
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  alass_path: "alass"
  # Videos analyzed per scan run (0 = no cap, the default). Probed results are
  # cached by path+size+mtime, and any movie that was not analyzed yet is probed
  # on demand when it is processed.
  scan_batch_size: 0
  # Movies processed per "Add missing subtitles" run.
  run_batch_size: 20
  # Delay between OpenSubtitles API calls (searches do not use download quota).
  request_interval_ms: 400
  # Stop downloading once this many quota downloads remain.
  quota_reserve: 5
  # Downloads attempted per movie and per language. "Retry with more
  # candidates" uses 20.
  max_candidates: 5
  # Extra precise query + ranking signal; never a hard filter.
  use_moviehash: true
  # Remove uploader/site promo cues and isolated over-10-minute cues.
  remove_promo_cues: true
  # Install the release-matched subtitle without alass when the reference is
  # unusable (marked added_review). Off by default.
  allow_unaligned_fallback: false
  # A reference with fewer cues than this is treated as unusable.
  min_reference_cues: 20
  min_video_bytes: 20971520
  skip_sample_files: true
  probe_timeout_seconds: 60
  # Extracting an embedded subtitle demuxes the whole video file, which can take
  # several minutes for a large movie on a spinning disk.
  extract_timeout_seconds: 900
  sync_timeout_seconds: 300
  alass_no_split: false
  alass_split_penalty: 7
  # Never overwrite an existing <video>.<language>.srt (reserved for a future
  # release).
  overwrite_existing: false
  # Timing gate from the proven manual pipeline; a subtitle that fails it is not
  # installed, and the attempt is kept for review instead.
  accept:
    min_within_2s: 0.90
    max_p90_nearest_seconds: 2.5
    max_start_gap_minutes: 10
    max_end_gap_minutes: 10
    max_zero_start_cues: 3
    max_cue_minutes: 10
    max_overrun_minutes: 15
  # Optional local-title -> English release-title map for localized filenames,
  # e.g. "el laberinto del fauno": "Pan's Labyrinth".
  title_overrides: {}
  opensubtitles:
    base_url: "https://api.opensubtitles.com/api/v1"
    # Alternatively: CINEROUTE_OS_API_KEY, CINEROUTE_OS_USERNAME, CINEROUTE_OS_PASSWORD
    api_key: ""
    # Optional but recommended: a logged-in account has a higher daily quota.
    username: ""
    password: ""

library:
  folder_format: "{title} ({year})"

# Mount /mnt/diskN/data once at /diskN in both CineRoute and qBittorrent. Keeping the
# primary and remote roots below one mount allows hardlinks between them.
drives:
  - id: "disk1"
    movie_root: "/disk1/media/movies"
    movie_remote_root: "/disk1/media/movies-remote"
    tv_root: "/disk1/media/tv"
    tv_remote_root: "/disk1/media/tv-remote"
    anime_root: "/disk1/media/anime"

  - id: "disk2"
    movie_root: "/disk2/media/movies"
    movie_remote_root: "/disk2/media/movies-remote"
    tv_root: "/disk2/media/tv"
    tv_remote_root: "/disk2/media/tv-remote"
    anime_root: "/disk2/media/anime"

  - id: "disk3"
    movie_root: "/disk3/media/movies"
    movie_remote_root: "/disk3/media/movies-remote"
    tv_root: "/disk3/media/tv"
    tv_remote_root: "/disk3/media/tv-remote"
    anime_root: "/disk3/media/anime"

  - id: "disk4"
    movie_root: "/disk4/media/movies"
    movie_remote_root: "/disk4/media/movies-remote"
    tv_root: "/disk4/media/tv"
    tv_remote_root: "/disk4/media/tv-remote"
    anime_root: "/disk4/media/anime"

# Optional integrated music engine. Runs inside this CineRoute container.
# Requires a paid Qobuz account and existing writable library/staging mounts.
# Music is independent of the movie/TV request policy and queues immediately.
music:
  enabled: false
  qobuz:
    user_id: "" # or CINEROUTE_QOBUZ_USER_ID
    token: ""   # or CINEROUTE_QOBUZ_TOKEN
    quality: 3 # 1 MP3, 2 CD, 3 up to 24/96, 4 up to 24/192
  paths:
    library: "/music"
    staging: "/staging" # separate from the library; same filesystem is faster
    data: "/data/music"
  naming:
    folder: "{albumartist}/{title} ({year})"
    track: "{tracknumber:02}. {title}"
    if_exists: "skip"
  download:
    attempts: 2
    verify_flac: true
    fix_md5: true
  metadata:
    translate_genres: true
    clean_descriptions: true
